  <body>
    <!-- Hidden H1 for SEO Indexing -->
    <h1 style="position:absolute; left:-9999px; top:-9999px;">JustDare - Real-Time Challenge App, Making Courage Pay</h1>

    <!-- Keep Android Open Banner - loaded before React app -->
    <div id="banner-container">
      <script src="https://keepandroidopen.org/banner.js?size=minimal&animation=off"></script>
    </div>

    <!-- SPA redirect restore: runs before React to fix the URL for direct visits -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('justdare-redirect');
        if (redirect) {
          sessionStorage.removeItem('justdare-redirect');
          // Only replace if the current path differs (avoid infinite loop)
          var current = location.pathname + location.search + location.hash;
          if (redirect !== current) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
