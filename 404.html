<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA redirect: save the intended path so index.html can restore it
      sessionStorage.setItem('justdare-redirect', location.pathname + location.search + location.hash);
      location.replace('/');
    </script>
    <title>Redirecting... | JustDare</title>
  </head>
  <body></body>
</html>
