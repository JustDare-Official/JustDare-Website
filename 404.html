<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <title>Page Not Found | JustDare</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #2e1065);
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background particles (optional) */
      .bg-particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .bg-particles span {
        position: absolute;
        display: block;
        width: 4px;
        height: 4px;
        background: rgba(236, 72, 153, 0.4);
        border-radius: 50%;
        filter: blur(1px);
        animation: float 6s infinite ease-in-out;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(-20px); opacity: 0.7; }
      }

      .wrapper {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
      }

      .glass-card {
        background: rgba(30, 41, 59, 0.35);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.5rem;
        padding: 3rem 2rem;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
      }

      .glass-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.15), transparent 60%);
        pointer-events: none;
      }

      .error-code {
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 700;
        background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 0.5rem;
      }

      h1 {
        font-size: clamp(1.5rem, 6vw, 2.5rem);
        font-weight: 700;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      p {
        font-size: 1rem;
        color: #94a3b8;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 2rem;
        border-radius: 9999px;
        background: linear-gradient(90deg, #ec4899, #a855f7);
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .dragon-img {
        width: 120px;
        margin-top: 1.5rem;
        opacity: 0.3;
        filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
        animation: float 3s ease-in-out infinite alternate;
      }

      @keyframes float {
        from { transform: translateY(0px); }
        to { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <!-- Background Particles -->
    <div class="bg-particles" aria-hidden="true">
      <span style="left: 10%; top: 20%; animation-duration: 5s;"></span>
      <span style="left: 20%; top: 80%; animation-duration: 8s;"></span>
      <span style="left: 50%; top: 10%; animation-duration: 7s;"></span>
      <span style="left: 80%; top: 40%; animation-duration: 6s;"></span>
      <span style="left: 90%; top: 70%; animation-duration: 9s;"></span>
      <span style="left: 40%; top: 50%; animation-duration: 4s;"></span>
      <span style="left: 70%; top: 30%; animation-duration: 6s;"></span>
      <span style="left: 30%; top: 90%; animation-duration: 5s;"></span>
    </div>

    <div class="wrapper">
      <div class="glass-card">
        <div class="error-code">404</div>
        <h1>Lost in the Dare?</h1>
        <p>The page you're looking for has vanished like a dare unclaimed. Maybe it's moved, or perhaps it never existed.</p>
        <a href="/" class="btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          Back to Home
        </a>
        <!-- Small dragon silhouette -->
        <img src="/assets/dragon.webp" alt="Dragon silhouette" class="dragon-img" />
      </div>
    </div>
  </body>
</html>
